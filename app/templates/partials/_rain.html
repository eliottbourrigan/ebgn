{# Pluie : canvas plein écran + réglages (app.js) #}
<canvas id="rain" class="fixed inset-0 z-40 size-full pointer-events-none" aria-hidden="true"></canvas>

<button type="button" id="rain-open" class="rain-gear fixed right-4 bottom-4 md:right-6 md:bottom-6 z-45 p-1 text-mute/70 hover:text-ink transition-colors duration-300 cursor-pointer" aria-label="Réglages de la pluie" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" class="size-4 fill-none stroke-current" aria-hidden="true">
    <circle cx="12" cy="12" r="6.2" stroke-width="1.2"/><circle cx="12" cy="12" r="2.4" stroke-width="1.2"/>
    <path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5.35 5.35l2.26 2.26M16.39 16.39l2.26 2.26M5.35 18.65l2.26-2.26M16.39 7.61l2.26-2.26" stroke-width="2.4"/>
  </svg>
</button>

<dialog id="rain-settings" class="rain-dialog" aria-labelledby="rain-title">
  <form method="dialog" class="flex flex-col gap-5">
    <header class="flex items-baseline justify-between">
      <h2 id="rain-title" class="font-medium">Précipitations</h2>
      <button class="rain-close -mr-1.5 -mt-1 p-1.5 text-carmine cursor-pointer" aria-label="Fermer">
        <svg viewBox="0 0 12 12" class="size-3 stroke-current" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke-width="1"/></svg>
      </button>
    </header>
    <div class="flex flex-col gap-3.5">
      {% for key, label, unit, lo, hi, step, default in rain %}
      <label class="flex flex-col gap-1.5">
        <span class="flex justify-between gap-4"><span>{{ label }}{% if unit %} <span class="text-mute">({{ unit }})</span>{% endif %}</span><output class="text-mute tabular-nums" data-for="{{ key }}"></output></span>
        <input type="range" class="rain-range" name="{{ key }}" min="{{ lo }}" max="{{ hi }}" step="{{ step }}" value="{{ default }}">
      </label>
      {% endfor %}
    </div>
    <div class="flex flex-wrap gap-x-5 gap-y-1.5 pt-1">
      <label class="rain-check"><input type="checkbox" name="follow"> Point de fuite = pointeur</label>
      <label class="rain-check"><input type="checkbox" name="clickdrop"> Clic = goutte</label>
      <label class="rain-check"><input type="checkbox" name="pause"> Pause</label>
    </div>
    <button type="button" id="rain-reset" class="self-start text-mute hover:text-carmine transition-colors duration-300 cursor-pointer">Réinitialiser</button>
  </form>
</dialog>
