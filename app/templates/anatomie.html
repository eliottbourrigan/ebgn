{% extends "base.html" %}
{% block title %}Anatomie — ebgn{% endblock %}
{% block head %}<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<script src="{{ static('vendor/htmx.min.js') }}" defer></script>{% endblock %}
{% block body %}
<main id="anatomie" class="fixed inset-0 overflow-hidden" data-model="{{ static('anatomie/ecorche.glb') }}">
  <canvas id="ana-canvas" class="absolute inset-0 size-full touch-none cursor-grab active:cursor-grabbing"></canvas>

  <div class="absolute inset-x-0 top-0 p-3 md:p-5 md:right-auto md:w-[420px]">
    <div class="bg-paper/95 border border-line focus-within:border-carmine transition-colors">
      <input id="ana-q" name="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
             placeholder="Rechercher un os, un muscle, un tendon…" aria-label="Rechercher une structure"
             class="w-full bg-transparent px-4 h-12 text-[16px] md:text-[13px] outline-none placeholder:text-mute"
             hx-get="/anatomie/recherche" hx-trigger="input changed delay:200ms, search" hx-target="#ana-results">
      <div id="ana-results" class="max-h-[50svh] overflow-y-auto border-t border-line [&:not(:has(*))]:hidden"></div>
    </div>
  </div>

  <div id="ana-status" class="absolute inset-0 grid place-content-center text-mute pointer-events-none" role="status">Chargement du modèle…</div>

  <div id="ana-selected" class="absolute inset-x-3 bottom-10 md:inset-x-auto md:left-5 md:bottom-12 hidden items-center gap-3 bg-paper/95 border border-carmine pl-4 pr-1 h-11 md:max-w-[420px]">
    <span class="size-2 shrink-0 rounded-full bg-carmine"></span>
    <span id="ana-name" class="min-w-0 flex-1 truncate"></span>
    <button id="ana-clear" type="button" class="link size-9 shrink-0 text-[18px] leading-none" aria-label="Désélectionner">×</button>
  </div>

  <p class="absolute inset-x-3 bottom-3 md:left-5 text-[10px] leading-tight text-mute pointer-events-none">
    Modèle <a class="link pointer-events-auto underline" href="https://github.com/Charleeh/ecorche" target="_blank" rel="noopener">Écorché</a>
    (BodyParts3D © DBCLS, Z-Anatomy) — <a class="link pointer-events-auto underline" href="{{ static('anatomie/LICENSE-CC-BY-SA-4.0.txt') }}">CC BY-SA 4.0</a>
  </p>
</main>
{% endblock %}
